<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <title>AIM</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="description" content="AIM — kafe, bar va restoranlar uchun planshetdagi onlayn menyu.">
  <meta name="theme-color" content="#1b1c20">
  <script>
    // Same rule as ThemeService, before the first paint (no light flash in dark mode)
    try {
      var theme = localStorage.getItem('onlinemenu.theme');
      if (theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
